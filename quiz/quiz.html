<title>Second Brain Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, one question card at a time, thumb-reach actions at the bottom of the card */
/* Themes: each sets base colours on <html data-skin>; soft/heat shades are derived. Default = Dracula. */
:root{
  --bg:#21222c; --surface:#282a36; --ink:#f8f8f2; --muted:#a4abcf; --line:#44475a;
  --accent:#bd93f9; --on-accent:#21222c; --pink:#ff79c6; --cyan:#8be9fd; --yellow:#f1fa8c;
  --good:#50fa7b; --warn:#ffb86c; --bad:#ff5555;
  --accent-soft:color-mix(in srgb, var(--accent) 20%, var(--surface));
  --good-soft:color-mix(in srgb, var(--good) 16%, var(--surface));
  --warn-soft:color-mix(in srgb, var(--warn) 16%, var(--surface));
  --bad-soft:color-mix(in srgb, var(--bad) 16%, var(--surface));
  --heat1:color-mix(in srgb, var(--accent) 35%, var(--line));
  --heat2:color-mix(in srgb, var(--accent) 65%, var(--line));
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
:root[data-skin="alucard"]{ /* Dracula's official light theme */
  --bg:#f5f1e3; --surface:#fffbeb; --ink:#1f1f1f; --muted:#635d97; --line:#cfcfde;
  --accent:#644ac9; --on-accent:#fffbeb; --pink:#a3144d; --cyan:#036a96; --yellow:#846e15;
  --good:#14710a; --warn:#a34d14; --bad:#cb3a2a; color-scheme:light }
:root[data-skin="light"]{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b1f24; --muted:#5b6474; --line:#dde1e7;
  --accent:#3b5bdb; --on-accent:#ffffff; --pink:#c2255c; --cyan:#0b7285; --yellow:#946200;
  --good:#2b8a3e; --warn:#b35c00; --bad:#c92a2a; color-scheme:light }
:root[data-skin="dark"]{
  --bg:#141619; --surface:#1d2025; --ink:#e8eaed; --muted:#9aa1ad; --line:#30343b;
  --accent:#8ea2ff; --on-accent:#141619; --pink:#f783ac; --cyan:#66d9e8; --yellow:#ffe066;
  --good:#69db7c; --warn:#ffa94d; --bad:#ff6b6b; color-scheme:dark }
:root[data-skin="one-dark"]{
  --bg:#21252b; --surface:#282c34; --ink:#dcdfe4; --muted:#9da5b4; --line:#3e4451;
  --accent:#61afef; --on-accent:#21252b; --pink:#c678dd; --cyan:#56b6c2; --yellow:#e5c07b;
  --good:#98c379; --warn:#d19a66; --bad:#e06c75; color-scheme:dark }
:root[data-skin="github-dark"]{
  --bg:#0d1117; --surface:#161b22; --ink:#e6edf3; --muted:#8d96a0; --line:#30363d;
  --accent:#58a6ff; --on-accent:#0d1117; --pink:#db61a2; --cyan:#39c5cf; --yellow:#e3b341;
  --good:#3fb950; --warn:#d29922; --bad:#f85149; color-scheme:dark }
:root[data-skin="github-light"]{
  --bg:#f6f8fa; --surface:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
  --accent:#0969da; --on-accent:#ffffff; --pink:#bf3989; --cyan:#1b7c83; --yellow:#9a6700;
  --good:#1a7f37; --warn:#bc4c00; --bad:#cf222e; color-scheme:light }
:root[data-skin="nord"]{
  --bg:#2e3440; --surface:#3b4252; --ink:#eceff4; --muted:#b4bccc; --line:#4c566a;
  --accent:#88c0d0; --on-accent:#2e3440; --pink:#b48ead; --cyan:#8fbcbb; --yellow:#ebcb8b;
  --good:#a3be8c; --warn:#d08770; --bad:#bf616a; color-scheme:dark }
:root[data-skin="tokyo-night"]{
  --bg:#16161e; --surface:#1a1b26; --ink:#c0caf5; --muted:#9aa5ce; --line:#292e42;
  --accent:#7aa2f7; --on-accent:#16161e; --pink:#bb9af7; --cyan:#7dcfff; --yellow:#e0af68;
  --good:#9ece6a; --warn:#ff9e64; --bad:#f7768e; color-scheme:dark }
:root[data-skin="catppuccin"]{ /* Mocha */
  --bg:#181825; --surface:#1e1e2e; --ink:#cdd6f4; --muted:#a6adc8; --line:#313244;
  --accent:#cba6f7; --on-accent:#181825; --pink:#f5c2e7; --cyan:#89dceb; --yellow:#f9e2af;
  --good:#a6e3a1; --warn:#fab387; --bad:#f38ba8; color-scheme:dark }
:root[data-skin="solarized-light"]{
  --bg:#eee8d5; --surface:#fdf6e3; --ink:#073642; --muted:#586e75; --line:#d9d2bf;
  --accent:#268bd2; --on-accent:#fdf6e3; --pink:#d33682; --cyan:#2aa198; --yellow:#b58900;
  --good:#859900; --warn:#cb4b16; --bad:#dc322f; color-scheme:light }
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:8px}
h1{font:700 1.6rem/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 .72rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--accent-soft);color:var(--pink)}
.chip.plain{background:transparent;color:var(--muted);padding-inline:0}
.topic{font:600 1.05rem/1.3 var(--display);margin:0}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ladder span{font:500 .62rem/1 var(--mono);color:var(--muted);text-align:center;padding-top:7px;border-top:3px solid var(--line);font-variant-numeric:tabular-nums}
.ladder span.done{border-color:var(--accent);opacity:.55}
.ladder span.now{border-color:var(--cyan);color:var(--cyan)}
.prompt{font-size:1.08rem;line-height:1.5;margin:0;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;text-align:left;min-height:48px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.opts button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;text-align:center;flex:1}
.ghost{text-align:center;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.fb{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.verdict{align-self:flex-start;font:600 .8rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:6px}
.v-correct,.r-pass{background:var(--good-soft);color:var(--good)}
.v-partial,.r-shaky{background:var(--warn-soft);color:var(--warn)}
.v-wrong,.r-fail{background:var(--bad-soft);color:var(--bad)}
.fb h3{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.fb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.fb p{margin:0;white-space:pre-wrap}
.mine{color:var(--muted);font-style:italic}
.self{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.self button{text-align:center;font-weight:600}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row div{min-width:0}
.row b{display:block;font-weight:600}
.row small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.pill{font:600 .72rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;white-space:nowrap}
.mode{display:flex;gap:4px;align-self:flex-start;background:var(--line);padding:3px;border-radius:9px}
.mode button{min-height:32px;padding:6px 10px;border:0;border-radius:7px;background:transparent;font-size:.8rem;color:var(--muted);text-align:center}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.view{display:flex;flex-direction:column;gap:16px}
.pselect{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.pcard .opts button{min-height:44px;padding:10px 12px}
.hud{gap:10px;padding:14px}
.hudrow{display:flex;align-items:center;gap:10px}
.hudmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hudmid b{font:600 .95rem/1 var(--display)}
.hudright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.hudright b{font:700 1rem/1 var(--mono);color:var(--accent)}
.hudright small{font:500 .7rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hudrow .pselect{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:var(--accent-soft);flex:none}
.hard{text-align:center;white-space:nowrap;min-height:44px;font-weight:600;color:var(--muted)}
.hard[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.pstage{position:relative;min-height:320px}
.pcard{position:relative;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s ease,box-shadow .2s ease}
.pcard.enter{transform:translateX(48px);opacity:0}
.pcard.leave{position:absolute;inset:0 0 auto 0;transform:translateX(-48px);opacity:0;pointer-events:none}
.pcard.good{box-shadow:0 0 0 2px var(--good),0 0 28px color-mix(in srgb,var(--good) 35%,transparent);animation:pop .32s ease}
.pcard.bad{box-shadow:0 0 0 2px var(--bad);animation:shake .38s ease}
.float{position:absolute;right:18px;top:14px;font:700 1.05rem/1 var(--mono);pointer-events:none;animation:floatup 1s ease forwards}
.float.up{color:var(--good)}.float.down{color:var(--bad)}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--warn);transform-origin:left;animation:tick linear forwards}
.tbar.stopped i{animation-play-state:paused}
.timeout{color:var(--bad);font-weight:600}
@keyframes tick{from{transform:scaleX(1)}to{transform:scaleX(0);background:var(--bad)}}
.combo{font:600 .72rem/1 var(--mono);color:var(--warn);letter-spacing:.06em;text-transform:uppercase}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{font-size:1.5rem;text-align:center;padding:8px 0;min-height:48px}
.icons button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.pcard,.pcard.good,.pcard.bad,.float{animation:none!important;transition:opacity .15s}.pcard.enter,.pcard.leave{transform:none}}
.xpgain{font:600 .78rem/1 var(--mono);color:var(--good);align-self:flex-start}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;gap:8px;padding:10px;text-align:left}
.skin[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin .sw{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.skin .sw i{flex:1}
.skin span{font-size:.85rem;font-weight:500}
.tabs{align-self:stretch}.tabs button{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile b{font:700 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:.74rem;line-height:1.3}
.tile .lbl{font:500 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xpbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--accent)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat .h1{background:var(--heat1)}.heat .h2{background:var(--heat2)}.heat .h3{background:var(--accent)}.heat .fut{background:transparent}
.heat .today{outline:1.5px solid var(--cyan);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:.72rem;color:var(--muted)}
.legend span{width:10px;height:10px;border-radius:2px;background:var(--line)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.mkeys{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 .72rem/1.4 var(--mono);color:var(--muted)}
.mkeys span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}.mkeys i{width:8px;height:8px;border-radius:2px;display:inline-block}
.card h2.small{font:600 1rem/1.3 var(--display);margin:0}
.empty h2{font:600 1.15rem/1.3 var(--display);margin:0}
.empty p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Second Brain Quiz</h1>
    <p class="sub" id="sub">Loading your questions…</p>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="mode tabs" id="tabs" role="tablist" aria-label="View">
      <button type="button" data-t="quiz">Quiz</button>
      <button type="button" data-t="practice">Practice</button>
      <button type="button" data-t="progress">Progress</button>
      <button type="button" data-t="settings">Settings</button>
    </div>
  </header>
  <div id="quizView" class="view">
    <div class="mode" id="style" role="group" aria-label="How you answer">
      <button type="button" data-s="tap">Tap answers</button>
      <button type="button" data-s="write">Write answers</button>
    </div>
    <div class="mode" id="mode" role="group" aria-label="How strictly Claude marks written answers" hidden>
      <button type="button" data-m="lenient">Lenient</button>
      <button type="button" data-m="balanced">Balanced</button>
      <button type="button" data-m="strict">Strict</button>
    </div>
  <main id="main">
    <section class="card empty">
      <h2>Waiting for today's questions</h2>
      <p>Questions load from your vault at the nightly sync, which also saves your answers back to it.</p>
    </section>
  </main>
  </div>
  <section id="progressView" class="view" hidden></section>
  <section id="practiceView" class="view" hidden>
    <section class="card hud">
      <div class="hudrow">
        <span class="avatar" id="pavatar" aria-hidden="true"></span>
        <div class="hudmid">
          <b id="plevel">Level 1</b>
          <div class="xpbar"><i id="pxpbar"></i></div>
        </div>
        <div class="hudright"><b id="pxp">0 XP</b><small id="pcombo">Combo 0</small></div>
      </div>
      <div class="hudrow">
        <select id="pfilter" class="pselect" aria-label="Focus"></select>
        <button type="button" class="hard" id="phard" aria-pressed="false">Hard mode</button>
      </div>
      <p class="hint" id="pnote"></p>
    </section>
    <div class="pstage" id="pstage"></div>
  </section>
  <section id="settingsView" class="view" hidden>
    <section class="card">
      <h2 class="small">Theme</h2>
      <div class="skins" id="skins" role="radiogroup" aria-label="Theme"></div>
      <p class="hint">Saved on this device.</p>
    </section>
    <section class="card">
      <h2 class="small">Your icon</h2>
      <div class="icons" id="icons" role="radiogroup" aria-label="Your icon"></div>
    </section>
    <section class="card">
      <h2 class="small">About</h2>
      <p class="hint" id="version"></p>
    </section>
  </section>
</div>

<script>
const WAIT = [1, 3, 7, 14, 31, 60, 120];
const KIND = { recall: "Recall", why: "Why", apply: "Apply", teach: "Teach it" };
const SCORE = { correct: 1, partial: 0.5, wrong: 0 };
const main = document.getElementById("main");
let Q = [], A = new Map(), db = null, sample = null;
let shownId = null, lastKey = "", busy = false, selfGrade = null;

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

// Same scoring the vault sync uses: avg >= .8 pass, >= .5 shaky, else fail
function topicResult(qs) {
  const s = qs.map(q => SCORE[A.get(q.id)?.verdict] ?? 0);
  const avg = s.reduce((a, b) => a + b, 0) / s.length;
  return avg >= 0.8 ? "pass" : avg >= 0.5 ? "shaky" : "fail";
}
function nextStage(stage, r) { return r === "pass" ? Math.min(stage + 1, 6) : r === "shaky" ? stage : 0; }

function render() {
  const pending = Q.filter(q => !A.has(q.id));
  const answered = Q.length - pending.length;
  const topics = [...new Set(Q.map(q => q.topic))];
  document.getElementById("prog").style.width = Q.length ? (answered / Q.length * 100) + "%" : "0";
  document.getElementById("sub").textContent = Q.length
    ? `${answered} of ${Q.length} answered · ${topics.length} topic${topics.length === 1 ? "" : "s"}`
    : "Nothing loaded yet";

  const cur = Q.find(q => q.id === shownId) || pending[0] || null;
  const key = !Q.length ? "empty" : !cur ? "done:" + A.size : cur.id + (shownId ? ":fb" : "") + (selfGrade ? ":self" : "");
  if (key === lastKey) return;          // keep typed text when a snapshot arrives
  lastKey = key;
  main.replaceChildren(!Q.length ? emptyCard() : !cur ? doneCard(topics) : questionCard(cur));
}

function emptyCard() {
  const c = el("section", "card empty");
  c.append(el("h2", null, "Nothing due right now"),
    el("p", null, "New questions load at the nightly sync, or tap Sync now on the Progress tab. Say \"ingest\" or \"quiz me\" to Claude to add more."));
  return c;
}

function ladder(stage) {
  const l = el("div", "ladder"); l.setAttribute("aria-label", `Stage ${stage} of 6`);
  WAIT.forEach((d, i) => l.append(el("span", i < stage ? "done" : i === stage ? "now" : "", d + "d")));
  return l;
}

function questionCard(q) {
  const c = el("section", "card");
  const stage = Number(q.stage) || 0;
  const meta = el("div", "meta");
  meta.append(el("span", "chip", KIND[q.kind] || q.kind), el("span", "chip plain", `Stage ${stage} · ${WAIT[stage]}d gap`));
  c.append(meta, el("h2", "topic", q.topic), ladder(stage), el("p", "prompt", q.prompt));

  const a = A.get(q.id);
  if (shownId === q.id && a) { c.append(feedback(q, a)); return c; }

  const hasOpts = Array.isArray(q.options) && q.options.length;
  if (hasOpts && (style === "tap" || q.kind === "recall")) {   // written mode: why/apply/teach get a text box
    const opts = el("div", "opts");
    shuffled(q.options.length).forEach(i => {            // new order every time, so position can't be memorised
      const o = q.options[i], b = el("button", null, o); b.dataset.i = i;
      b.onclick = () => {
        const ok = i === Number(q.correct);
        opts.querySelectorAll("button").forEach(x => { x.disabled = true; if (Number(x.dataset.i) === Number(q.correct)) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        save(q, { response: o, verdict: ok ? "correct" : "wrong", right: [], missing: ok ? [] : [q.options[q.correct]], tip: "" });
      };
      opts.append(b);
    });
    c.append(opts, dontKnow(q));
    return c;
  }

  const ta = el("textarea"); ta.id = "ans-" + q.id; ta.placeholder = "Type or dictate your answer";
  ta.setAttribute("aria-label", "Your answer");
  if (selfGrade === q.id) { c.append(selfGradeBlock(q, ta.value)); return c; }
  const check = el("button", "primary", "Check answer");
  check.onclick = () => grade(q, ta.value, check);
  const row = el("div", "actions"); row.append(check, dontKnow(q, true));
  c.append(ta, row, el("p", "hint", "Tip: tap the mic on your keyboard to answer by voice."));
  return c;
}

  writeDay(d => ({ ...d, n: d.n + 1, [verdict[0]]: (d[verdict[0]] || 0) + 1, xp: d.xp + delta }));
  c.classList.add(ok ? "good" : "bad");
  c.append(el("span", "float " + (delta >= 0 ? "up" : "down"), `${delta >= 0 ? "+" : ""}${delta} XP`));
  if (ok && combo > 1) c.append(el("span", "combo", `Combo ×${combo}`));
  hud();
  if (ok) { setTimeout(() => { if (current === q) nextCard(); }, 850); return; }
  if (i === -1) c.append(el("p", "hint timeout", "Time's up."));
  c.append(el("p", "hint", q.answer || q.options[q.correct]));
  const nx = el("button", "primary", "Next"); nx.onclick = nextCard;
  const row = el("div", "actions"); row.append(nx); c.append(row);
  db.collection("answers").doc(`p-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`)
    .set({ mode: "practice", page: q.page, topic: q.topic, kind: q.kind, verdict, missing: [q.options[q.correct]], at: new Date().toISOString() }).catch(() => {});
}
function nextCard() {
  clearTimeout(timer); timer = null;
  const stageEl = document.getElementById("pstage");
  if (!POOL.length) {
    current = null;
    const e = el("section", "card empty"); e.append(el("h2", null, "No question bank yet"), el("p", null, "Your questions appear here after the next sync."));
    stageEl.replaceChildren(e); return;
  }
  if (!bag.length) refill();
  const q = bag.shift(); if (!q) return;
  const old = stageEl.querySelector(".pcard:not(.leave)");
  current = q;
  const card = cardFor(q);
  if (old) { old.classList.add("leave"); setTimeout(() => old.remove(), 300); }
  else stageEl.replaceChildren();
  stageEl.append(card);
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove("enter")));
}
function startPractice() {
  hud();
  if (practiceStarted) return;
  practiceStarted = true;
  const sel = document.getElementById("pfilter");
  sel.onchange = () => { pfilter = sel.value; bag = []; nextCard(); };
  document.getElementById("phard").onclick = () => { hard = !hard; combo = 0; try { localStorage.setItem("hard", hard ? "1" : "0"); } catch (e) {} hud(); bag = []; nextCard(); };
  nextCard();
}
// Icon picker (saved on the quiz page, so it follows you across devices)
const iconBox = document.getElementById("icons");
function showIcons() { iconBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(b.textContent === myIcon()))); }
for (const ic of ICONS) {
  const b = el("button", null, ic); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-label", "Icon " + ic);
  b.onclick = async () => {
    STATS = { ...STATS, profile: { icon: ic } }; showIcons(); hud(); if (tab === "progress") renderProgress();
    try { await db.collection("stats").doc("profile").set({ icon: ic }); } catch (e) {}
  };
  iconBox.append(b);
}
showIcons();

async function boot() {
  if (!window.claude?.use) return;
  db = await claude.use("db");
  if (!db) { document.getElementById("sub").textContent = "Open this page in Claude to load your questions."; return; }
  claude.use("sample").then(s => { sample = s; });
  claude.use("mcp").then(m => { mcp = m; if (tab === "progress") renderProgress(); });
  const fail = () => { document.getElementById("sub").textContent = "Lost connection. Reopen the page to reload."; };
  let qSeen = false;
  db.collection("activity").onSnapshot(s => {
    ACT = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); actLoaded = true;
    if (qSeen && !Q.length) markChecked();
    if (tab === "progress") renderProgress();
  }, () => {});
  db.collection("stats").onSnapshot(s => { STATS = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); showIcons(); if (tab === "progress") renderProgress(); if (tab === "practice") hud(); }, () => {});
  db.collection("bank").onSnapshot(s => { buildPool(s.docs.map(d => d.data())); }, () => {});
  db.collection("questions").orderBy("order").onSnapshot(s => {
    Q = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
    if (!s.metadata?.fromCache) { qSeen = true; if (!Q.length) markChecked(); }
  }, fail);
  db.collection("answers").onSnapshot(s => {
    const m = new Map(s.docs.map(d => [d.id, d.data()]));
    for (const [k, v] of A) if (!m.has(k) && k === shownId) m.set(k, v);   // keep local feedback until the write lands
    A = m; render();
  }, fail);
}
boot();
</script>
